[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

# SPA: semua rute dilayani index.html. Rute /api/* ditangani fungsi lebih dulu.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
